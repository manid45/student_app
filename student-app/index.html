<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Registration & Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">

  <!-- SIGNUP FORM -->
  <div id="signupBox">
    <h1>Student Registration</h1>
    <p class="sub">Create your account</p>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 6 characters">
    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" placeholder="Re-enter password">
    <button onclick="registerUser()">Sign Up</button>
    <div id="signupMsg" class="msg"></div>
    <div class="link">Already registered? <a onclick="showLogin()">Login</a></div>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginBox" class="hidden">
    <h1>Student Login</h1>
    <p class="sub">Welcome back</p>
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" placeholder="Enter your email">
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" placeholder="Enter your password">
    <button onclick="loginUser()">Login</button>
    <div id="loginMsg" class="msg"></div>
    <div class="link">New student? <a onclick="showSignup()">Sign Up</a></div>
  </div>

  <!-- WELCOME SCREEN (after successful login) -->
  <div id="welcomeBox" class="welcome hidden">
    <h1 id="welcomeText"></h1>
    <p>You have logged in successfully.</p>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
